name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Нужна история: версия сравнивается с состоянием ДО этого пуша.
          fetch-depth: 0
      - name: Did the version change?
        # ⚠️ Триггер — любая правка pyproject.toml, а реестр не принимает одну
        # версию дважды. Правка зависимостей без бампа запускала публикацию той
        # же версии, и прогон краснел. Публикуем, только если `version` сменилась
        # относительно состояния до пуша (`github.event.before`, а если его нет —
        # предыдущий коммит). Ручной запуск (workflow_dispatch) публикует всегда:
        # это осознанное действие владельца, например повтор упавшей выкладки.
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          read_version() {
            python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])'
          }
          now="$(read_version < pyproject.toml)"
          if [ "$EVENT" != "push" ]; then
            echo "Manual run: publishing $now"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          before="$(git show "${base}:pyproject.toml" 2>/dev/null | read_version 2>/dev/null || true)"
          if [ "$now" != "$before" ]; then
            echo "Version ${before:-<none>} -> $now: publishing"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version is still $now: pyproject.toml changed without a bump, nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Custom Node
        if: steps.version.outputs.changed == 'true'
        # ⚠️ Полный коммит, а не ветка: `@main` означает «выполнить то, что
        # окажется в чужом репозитории в момент публикации», причём с
        # доступом к токену реестра.
        #
        # ⚠️⚠️ Коммит верхушки main, а НЕ тега 1.0.1. Тег закрепляет только
        # само действие, а `comfy-cli` оно ставит свежий при каждом запуске —
        # и пара разъехалась: старое действие зовёт `comfy --yes env`, чего
        # нынешний cli уже не понимает («No such option: --yes»), публикация
        # падает на шаге телеметрии, а сама выкладка пропускается. Проверено
        # прогоном 31404722915. У верхушки main вызов другой:
        # `comfy --skip-prompt --no-enable-telemetry env`.
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }} ## Add your own personal access token to your Github Repository secrets and reference it here.