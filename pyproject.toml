[project]
name = "comfyui-timesaver"
description = "ComfyUI nodes from [Timesaver](https://github.com/AlexYez/comfyui-timesaver)."
version = "9.95"
license = { file = "LICENSE.txt" }
# Matches CI (.github/workflows/ci.yml) and the Python range ComfyUI itself
# supports; >=3.12 wrongly blocked pip installs on 3.10/3.11.
requires-python = ">=3.10"
# Core runtime: pulled by every node pack on every install. Things that
# fail-gracefully via TSDependencyManager.import_optional or `try / except
# ImportError` belong in [project.optional-dependencies] below, not here.
dependencies = [
    "huggingface_hub>=0.20.0",
    "transformers>=4.57.0",
    "accelerate>=0.21.0",
    "imageio>=2.20.0",
    "imageio-ffmpeg>=0.4.0",
    "matplotlib>=3.4.0",
    "opencv-python>=4.5.0",
    "py360convert>=0.1.0",
    "srt>=3.5.0",
    # Native OpenAI Whisper — the unified engine (nodes/_whisper_engine.py) used
    # by both TS Whisper and TS Super Prompt voice. Small package; pulls tiktoken
    # (already core) plus a couple of light native deps.
    "openai-whisper>=20231117",
    # TS Files Downloader imports requests at module level. It used to arrive
    # transitively through huggingface_hub, which is not a guarantee.
    "requests>=2.28.0",
    "urllib3>=1.26.0",
    "easydict>=1.10.0",
    "tiktoken",
]

[project.optional-dependencies]
# bitsandbytes provides int4 / int8 quantisation for TS_Qwen3_VL_V3.
# Hard-pinned previously, which broke installs on Apple Silicon, ROCm and
# CPU-only setups; the node falls back to fp16 / bf16 / fp32 when the import
# fails. Install with `pip install comfyui-timesaver[llm-quant]` if you want
# int4 / int8 precision options to appear in the dropdown.
llm-quant = ["bitsandbytes>=0.40.0"]

# Demucs source separation (TS_Music_Stems). geomloss / pykeops compile from
# C++ source and frequently fail on Windows portable builds, so they are
# opt-in. `pip install comfyui-timesaver[audio-stems]` to enable.
audio-stems = [
    "demucs",
    "geomloss",
    "pykeops",
]

# Whisper transcription (TS_Whisper + TS_SuperPrompt voice) runs on native
# openai-whisper, which is now a CORE dependency (see [project.dependencies]).
# This extra is kept as a backward-compatible alias for anyone who installed
# `[audio-whisper]` before.
audio-whisper = ["openai-whisper>=20231117"]

# Russian TTS / stress-marking (TS_Silero_TTS, TS_Silero_Stress). Optional
# even on a working CUDA box because the Silero packages require specific
# torch versions that may conflict with the user's ComfyUI install.
audio-silero = [
    "silero",
    "silero-stress",
]

# Convenience meta-extra: install everything optional in one go.
all = [
    "bitsandbytes>=0.40.0",
    "demucs",
    "geomloss",
    "pykeops",
    "openai-whisper>=20231117",
    "silero",
    "silero-stress",
]

[project.urls]
Repository = "https://github.com/AlexYez/comfyui-timesaver"

[tool.comfy]
PublisherId = "timesaver"
DisplayName = "ComfyUI Timesaver Nodes"
Icon = "https://raw.githubusercontent.com/AlexYez/comfyui-timesaver/refs/heads/master/icon.png"
# Pinned to the ComfyUI release that exposes the comfy_api.latest IO surface
# this pack relies on (IO.ComfyNode, IO.Schema, IO.NodeOutput, IO.Color, etc.).
requires-comfyui = ">=0.20.1"

[tool.ruff]
# Matches the runtime floor in requires-python.
target-version = "py310"
line-length = 120
# Vendored upstream model code is carried as-is: reformatting it would make
# every future sync with its origin a merge conflict for no benefit.
extend-exclude = [
    "nodes/video_depth_anything",
    "nodes/frame_interpolation_models",
]

[tool.ruff.lint]
# A deliberately small, high-signal set. The pack's own conventions (one node
# per file, god-files are fine, comments carry reasoning) are enforced by
# review and the guard tests in tests/, not by a linter — so style rules that
# would fight them stay off.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes: undefined names, unused imports
    "B",    # bugbear: mutable defaults, shadowed loop vars, except pitfalls
    "UP",   # pyupgrade: syntax that 3.10 made obsolete
    "I",    # import sorting
    "T20",  # print() — already frozen by tests/test_no_print_logging.py
]
ignore = [
    "E501",  # line length is advisory here; tooltips and URLs are long by nature
    "B008",  # call-in-default is how several ComfyUI IO helpers are written
    # zip(..., strict=) is a behaviour change, not a cleanup: it turns a
    # length mismatch into an exception. Each site needs its own decision, so
    # it does not belong in a lint that must stay green.
    "B905",
    # Typing modernisation only. Ruff marks both as unsafe fixes because the
    # rewrite can change how annotations evaluate at runtime, and ComfyUI
    # introspects node signatures — not worth the risk for a cosmetic gain.
    "UP045",
    "UP035",
    # Two loops read their index for logging context only; renaming the
    # variable would say less, not more.
    "B007",
]

[tool.ruff.lint.per-file-ignores]
# Tests stub modules into sys.modules before importing the pack, so imports
# legitimately happen below other statements.
"tests/*" = ["E402"]
# These modules re-export engine symbols on purpose: the test suite patches
# them by that name (project_memory/reference_node_import_paths.md). "Unused"
# here means "used from outside".
"nodes/llm/super_prompt/_qwen.py" = ["F401"]
"nodes/llm/super_prompt/_voice.py" = ["F401"]
"nodes/llm/super_prompt/_helpers.py" = ["F401", "E402"]
# Backward-compatibility shim: it exists to re-export the split-out module's
# names for anything that still imports the old path.
"nodes/llm/ts_super_prompt.py" = ["F401"]
# Standalone self-test block, already allowlisted by tests/test_no_print_logging.py.
"nodes/ideogram/_ideogram_helpers.py" = ["T201"]

[tool.bandit]
# Two rules are silenced project-wide with an explicit justification so the
# Comfy registry security scanner (bandit-based) stops false-flagging legit
# patterns the pack relies on:
#
# B108 (hardcoded /tmp): only used as fixture data inside the pytest suite
#     (tests/test_downloader.py, tests/test_qwen_engine.py); production code
#     never hardcodes /tmp. Suppressing globally avoids dozens of per-line
#     `# nosec` comments scattered through the test files.
#
# B615 (HuggingFace download without revision pin): every HF call in the
#     pack passes `revision="main"`, which is the canonical stable branch
#     for each model repository this pack uses. B615 requires a full commit
#     SHA to silence, but pinning to a specific commit breaks downstream
#     "always use the latest stable release" semantics that end users
#     expect from a node pack. The risk B615 guards against (supply-chain
#     attack via mutated revision) is mitigated by huggingface_hub's own
#     integrity verification of each downloaded file.
skips = ["B108", "B615"]
